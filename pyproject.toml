[project]
name = "alteram"
version = "0.1.0"
description = "AI adjudication system for small disputes"
readme = "README.md"
authors = [
    { name = "Gabriel Gaspar", email = "gabrielsgaspar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.17",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
