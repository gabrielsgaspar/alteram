name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-trixie
        env:
          POSTGRES_USER: alteram
          POSTGRES_DB: alteram
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U alteram -d alteram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LANGSMITH_TRACING: "false"
      ALTERAM_TEST_DATABASE_URL: postgresql://alteram@localhost:5432/alteram_test
      ALTERAM_REQUIRE_DB: "1"
    steps:
      # The service starts before checkout, so it can't mount docker/initdb.
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U alteram -d alteram -c 'CREATE DATABASE alteram_test OWNER alteram'
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
