name: Sandbox probe

# Does uv work inside the Claude step's sandbox? Runs `uv run ruff check .`
# and `uv run pytest -q` through the sandbox runtime Claude Code is built on
# (@anthropic-ai/sandbox-runtime, CLI `srt`), with the filesystem, network
# and credential rules agent-build's Claude step ends up with: the repo's
# .claude/settings.json, the step's `settings`, and its Read deny rules
# (Claude Code merges Read deny rules into the sandbox). No secrets, no
# Claude, contents: read only.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

env:
  SRT_VERSION: 0.0.81

jobs:
  probe:
    name: ${{ matrix.os }} / ${{ matrix.layout }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        # baseline        as agent-build: Python in setup-uv's _temp dir,
        #                 cache in ~/.cache/uv
        # opt             Python in /opt/uv-python, cache in /opt/uv-cache
        # opt-writable    same, and /opt/uv-cache added to allowWrite (in
        #                 place of ~/.cache/uv's role); no deny rule changes
        layout: [baseline, opt, opt-writable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Outside /home/runner: the merged Read denies hide /home/runner/.*,
      # where npx would cache it. (Claude Code embeds its own helper.)
      - name: Install sandbox-runtime ${{ env.SRT_VERSION }} under /opt/srt
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/srt
          npm install --prefix /opt/srt --no-audit --no-fund "@anthropic-ai/sandbox-runtime@${SRT_VERSION}"
          npx --prefix /opt/srt --no-install srt --help > /dev/null

      - name: uv folders for layout ${{ matrix.layout }}
        env:
          LAYOUT: ${{ matrix.layout }}
        run: |
          set -euo pipefail
          if [ "${LAYOUT}" = "baseline" ]; then
            echo "UV_CACHE_DIR=/home/runner/.cache/uv" >> "${GITHUB_ENV}"
          else
            # Created before setup-uv and uv sync, owned by the runner user.
            sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/uv-python /opt/uv-cache
            echo "UV_PYTHON_INSTALL_DIR=/opt/uv-python" >> "${GITHUB_ENV}"
            echo "UV_CACHE_DIR=/opt/uv-cache" >> "${GITHUB_ENV}"
          fi

      # The agent-build step, copied verbatim (lines 163-241 of
      # agent-build.yml on main).
      - name: Install sandbox dependencies (bubblewrap, socat)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat

          sandbox_err="${RUNNER_TEMP}/sandbox.err"
          failed=""
          # Outer: the user namespace bwrap makes for every sandboxed command.
          bwrap_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid true 2> "${sandbox_err}"
          }
          # Nested: what apply-seccomp does inside that sandbox. unshare with
          # --map-current-user writes setgroups "deny" and an identity uid/gid
          # map (needs CAP_SYS_ADMIN in the new namespace), then makes new PID
          # and mount namespaces, as the helper does.
          nested_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid --unshare-net --cap-drop ALL \
              unshare --user --map-current-user --pid --mount --fork true 2> "${sandbox_err}"
          }
          sandbox_ok() {
            failed="outer"
            bwrap_ok || return 1
            failed="nested"
            nested_ok || return 1
            failed=""
          }
          write_bwrap_profile() {
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
          }

          restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns: ${restrict}"

          # a.
          if ! bwrap_ok && [ "${restrict}" = "1" ]; then
            echo "bwrap failed; adding the AppArmor profile for /usr/bin/bwrap."
            write_bwrap_profile
            sudo systemctl reload apparmor
          fi

          # b.
          if ! sandbox_ok && [ "${restrict}" = "1" ]; then
            echo "The ${failed} user namespace check fails; turning the user namespace restriction off (ephemeral runner)."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # c.
          if ! sandbox_ok && sudo grep -q '^unpriv_bwrap ' /sys/kernel/security/apparmor/profiles; then
            echo "The ${failed} user namespace check still fails and unpriv_bwrap is loaded; replacing bwrap-userns-restrict with the documented bwrap profile (ephemeral runner)."
            if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
              sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            fi
            write_bwrap_profile
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

          if ! sandbox_ok; then
            echo "Restriction now: $(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
            echo "AppArmor label of a command bwrap starts: $(bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid cat /proc/self/attr/current 2>/dev/null || echo unknown)"
            echo "Loaded AppArmor profiles with bwrap in the name:"
            sudo grep -i bwrap /sys/kernel/security/apparmor/profiles || echo "  none"
            if [ "${failed}" = "outer" ]; then
              echo "::error::bubblewrap cannot create its user namespace, so the Claude Code sandbox cannot start. bwrap said: $(< "${sandbox_err}")"
            else
              echo "::error::The sandbox's nested user namespace gets no capabilities, so apply-seccomp would fail every sandboxed Bash command (write /proc/self/setgroups). unshare said: $(< "${sandbox_err}")"
            fi
            exit 1
          fi
          echo "bubblewrap and the nested user namespace work."

      - name: ripgrep (srt uses it for denyRead globs; Claude Code bundles its own)
        run: sudo apt-get install -y --no-install-recommends ripgrep

      # Same as agent-build, except cache-local-path follows the layout.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: ${{ matrix.layout == 'baseline' && '/home/runner/.cache/uv' || '/opt/uv-cache' }}
      - run: uv sync --locked

      - name: Where uv put things (outside the sandbox)
        run: |
          echo "UV_PYTHON_INSTALL_DIR=${UV_PYTHON_INSTALL_DIR:-unset}"
          echo "UV_CACHE_DIR=${UV_CACHE_DIR:-unset}"
          echo ".venv/bin/python -> $(readlink -f .venv/bin/python)"
          grep -E '^home' .venv/pyvenv.cfg
          du -sh "${UV_CACHE_DIR}" 2>/dev/null || true

      - name: Probe through srt
        env:
          OS: ${{ matrix.os }}
          LAYOUT: ${{ matrix.layout }}
        run: |
          set +e -uo pipefail
          settings="${RUNNER_TEMP}/srt-settings.json"
          # Claude Code gives sandboxed commands their own TMPDIR under /tmp
          # and adds it to allowWrite; this mimics that.
          sandbox_tmp="/tmp/claude-$(id -u)"
          mkdir -p "${sandbox_tmp}"
          python3 - "${settings}" "${LAYOUT}" "${sandbox_tmp}" <<'PY'
          import json, sys
          dst, layout, tmp = sys.argv[1:]
          deny_read = [
              # .claude/settings.json: sandbox.filesystem.denyRead and the
              # permissions.deny Read rules (the same .env paths)
              "./.env", "./.env.local", "./.env.production", "./**/.env",
              # agent-build Claude step: --disallowedTools Read(...) rules,
              # in the form Claude Code passes them on
              "./.git/config", "/proc/**", "/etc/**", "/root/**", "/tmp/**",
              "/home/runner/.*", "/home/runner/.*/**",
              "/home/runner/work/_temp/**", "/home/runner/work/_actions/**",
              "/home/runner/work/_tool/**", "/home/runner/runners/**",
          ]
          allow_write = [".", "~/.cache/uv", tmp]
          if layout == "opt-writable":
              allow_write.append("/opt/uv-cache")
          deny_env = ["CLAUDE_CODE_OAUTH_TOKEN", "ANTHROPIC_API_KEY", "GITHUB_TOKEN",
                      "GH_TOKEN", "ACTIONS_RUNTIME_TOKEN", "ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          cfg = {
              "filesystem": {"denyRead": deny_read, "allowWrite": allow_write, "denyWrite": []},
              "network": {
                  "allowedDomains": ["pypi.org", "files.pythonhosted.org", "github.com", "api.github.com"],
                  "deniedDomains": ["github.com", "api.github.com"],
              },
              "credentials": {
                  "envVars": [{"name": n, "mode": "deny"} for n in deny_env],
                  "files": [{"path": "~/.claude/.credentials.json", "mode": "deny"},
                            {"path": "~/.claude.json", "mode": "deny"}],
              },
          }
          json.dump(cfg, open(dst, "w"), indent=2)
          PY
          echo "::group::srt settings"; cat "${settings}"; echo; echo "::endgroup::"
          # A planted secret: synthetic, only to prove denyRead holds.
          echo "PROBE_CANARY=not-a-secret" > .env

          srt() { TMPDIR="${sandbox_tmp}" npx --prefix /opt/srt --no-install srt --settings "${settings}" "$@"; }
          # offline: UV_PYTHON_DOWNLOADS=never UV_OFFLINE=1 in the environment
          # the sandboxed command inherits, as a Claude step env would give it.
          run_srt() {
            if [ "$1" = offline ]; then
              UV_PYTHON_DOWNLOADS=never UV_OFFLINE=1 srt -c "$2"
            else
              srt -c "$2"
            fi
          }
          show() {
            echo "::group::evidence: $1"
            run_srt offline "$2" 2>&1 | tail -n 40
            echo "::endgroup::"
          }
          results=""
          fails=0
          # expect 0: must succeed. expect 1: an enforcement check, passes only
          # if the sandboxed shell started and then the denied action failed.
          check() {
            local label="$1" expect="$2" mode="$3" cmd="$4" out rc verdict
            if [ "${expect}" = 1 ]; then cmd="echo SRT_STARTED; ${cmd}"; fi
            out="$(run_srt "${mode}" "${cmd}" 2>&1)"; rc=$?
            if { [ "${expect}" = 0 ] && [ "${rc}" = 0 ]; } ||
               { [ "${expect}" = 1 ] && [ "${rc}" != 0 ] && grep -q '^SRT_STARTED$' <<< "${out}"; }; then
              verdict=pass
            else
              verdict=FAIL; fails=$((fails + 1))
            fi
            echo "::group::${label}: ${verdict} (exit ${rc})"
            printf '%s\n' "${out}" | tail -n 25
            echo "::endgroup::"
            echo "RESULT|${OS}|${LAYOUT}|${label}|${verdict}|${rc}"
            results="${results}| ${label} | ${verdict} | ${rc} |"$'\n'
          }

          # Evidence: what uv sees inside the sandbox.
          show "environment" 'env | grep -E "^(UV_|TMPDIR=)" | sort'
          show "venv interpreter" 'ls -l .venv/bin/python; p="$(readlink -f .venv/bin/python)"; echo "resolves to: $p"; ls -l "$p"; cat .venv/pyvenv.cfg'
          show "Python install dir" 'd="${UV_PYTHON_INSTALL_DIR:-unset}"; echo "$d"; ls -la "$d"'
          show "cache dir" 'echo "$UV_CACHE_DIR"; ls -la "$UV_CACHE_DIR" | head -n 8; touch "$UV_CACHE_DIR/.probe-write" && echo "cache writable" && rm -f "$UV_CACHE_DIR/.probe-write"'
          show "uv -v run (interpreter discovery)" 'uv -v run python -c "import sys; print(sys.executable)" 2>&1 | grep -v -E "^\s*$" | head -n 40'

          check "as Claude ran it: uv run pytest -q" 0 plain "uv run pytest -q"
          check "offline: uv run ruff check ." 0 offline "uv run ruff check ."
          check "offline: uv run pytest -q" 0 offline "uv run pytest -q"
          check "offline: uv sync (allowed for Claude)" 0 offline "uv sync"
          check "enforced: .env unreadable" 1 offline "cat .env"
          check "enforced: _temp hidden" 1 offline 'test -n "$(ls -A /home/runner/work/_temp)"'
          check "enforced: home dotdirs hidden (~/.npm)" 1 offline 'test -n "$(ls -A /home/runner/.npm 2>/dev/null)"'
          check "enforced: github.com denied" 1 offline "curl -sS --max-time 10 -o /dev/null https://github.com"
          check "enforced: no nested userns" 1 offline "unshare --user true"

          {
            echo "### ${OS} / ${LAYOUT}"
            echo "| check | result | exit |"
            echo "| --- | --- | --- |"
            printf '%s' "${results}"
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f .env
          exit $(( fails > 0 ))
