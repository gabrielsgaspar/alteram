name: Sandbox probe

# Runs agent-build's build-job setup, copied text-for-text by a generator
# (sandbox setup step, job env, uv folders, setup-uv, uv sync), then runs
# uv inside the sandbox runtime Claude Code is built on
# (@anthropic-ai/sandbox-runtime, CLI `srt`) with the sandbox config the
# Build step ends up with, read at run time from agent-build.yml and
# .claude/settings.json: filesystem, network and credential rules, and the
# Read deny rules (Claude Code applies them to the sandbox). The sandboxed
# commands get the Build step's env. No secrets, no Claude, contents: read.
on:
  push:
    branches: ["probe/**"]

permissions:
  contents: read

env:
  SRT_VERSION: 0.0.81
  # agent-build's workflow-level value, overridden by the job env below.
  UV_CACHE_DIR: /home/runner/.cache/uv

jobs:
  probe:
    name: ${{ matrix.os }} / agent-build setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
    # --- copied from agent-build.yml, build job ---
    env:
      UV_PYTHON_INSTALL_DIR: /opt/uv-python
      UV_CACHE_DIR: /opt/uv-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      # Outside /home/runner: the Read denies hide /home/runner/.*, where npx
      # would cache it. (Claude Code embeds its own helper.)
      - name: Install sandbox-runtime ${{ env.SRT_VERSION }} under /opt/srt
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -u)" -g "$(id -g)" /opt/srt
          npm install --prefix /opt/srt --no-audit --no-fund "@anthropic-ai/sandbox-runtime@${SRT_VERSION}"
          npx --prefix /opt/srt --no-install srt --help > /dev/null

      # --- copied from agent-build.yml, build job ---
      - name: Install sandbox dependencies (bubblewrap, socat)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat

          sandbox_err="${RUNNER_TEMP}/sandbox.err"
          failed=""
          # Outer: the user namespace bwrap makes for every sandboxed command.
          bwrap_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid true 2> "${sandbox_err}"
          }
          # Nested: what apply-seccomp does inside that sandbox. unshare with
          # --map-current-user writes setgroups "deny" and an identity uid/gid
          # map (needs CAP_SYS_ADMIN in the new namespace), then makes new PID
          # and mount namespaces, as the helper does.
          nested_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid --unshare-net --cap-drop ALL \
              unshare --user --map-current-user --pid --mount --fork true 2> "${sandbox_err}"
          }
          sandbox_ok() {
            failed="outer"
            bwrap_ok || return 1
            failed="nested"
            nested_ok || return 1
            failed=""
          }

          restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns: ${restrict}"
          if [ "${restrict}" = "1" ]; then
            if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              echo "Removing bwrap-userns-restrict (it moves bwrap's commands into unpriv_bwrap)."
              sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
              sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            fi
            echo "Loading the documented AppArmor profile for /usr/bin/bwrap."
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

          if ! sandbox_ok; then
            echo "AppArmor label of a command bwrap starts: $(bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid cat /proc/self/attr/current 2>/dev/null || echo unknown)"
            echo "Loaded AppArmor profiles with bwrap in the name:"
            sudo grep -i bwrap /sys/kernel/security/apparmor/profiles || echo "  none"
            if [ "${failed}" = "outer" ]; then
              echo "::error::bubblewrap cannot create its user namespace, so the Claude Code sandbox cannot start. bwrap said: $(< "${sandbox_err}")"
            else
              echo "::error::The sandbox's nested user namespace gets no capabilities, so apply-seccomp would fail every sandboxed Bash command (write /proc/self/setgroups). unshare said: $(< "${sandbox_err}")"
            fi
            exit 1
          fi
          echo "bubblewrap and the nested user namespace work."
      # --- end of copy ---

      - name: ripgrep (srt uses it for denyRead globs; Claude Code bundles its own)
        run: sudo apt-get install -y --no-install-recommends ripgrep

      # --- copied from agent-build.yml, build job ---
      - name: uv folders outside the paths the sandbox hides
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" "${UV_PYTHON_INSTALL_DIR}" "${UV_CACHE_DIR}"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          cache-local-path: /opt/uv-cache
      - run: uv sync --locked --managed-python
      # --- end of copy ---

      - name: Where uv put things (outside the sandbox)
        run: |
          echo "UV_PYTHON_INSTALL_DIR=${UV_PYTHON_INSTALL_DIR:-unset}"
          echo "UV_CACHE_DIR=${UV_CACHE_DIR:-unset}"
          echo ".venv/bin/python -> $(readlink -f .venv/bin/python)"

      # The Build step's sandbox config and env, read from agent-build.yml.
      - name: srt settings from agent-build.yml and .claude/settings.json
        run: |
          set -euo pipefail
          uv run --no-project --with pyyaml python - "${RUNNER_TEMP}/srt-settings.json" "${RUNNER_TEMP}/sandbox.env" <<'PY'
          import json, re, shlex, sys
          import yaml

          settings_out, env_out = sys.argv[1:]
          wf = yaml.safe_load(open(".github/workflows/agent-build.yml"))
          step = next(s for s in wf["jobs"]["build"]["steps"] if s.get("name") == "Build")
          extra = json.loads(step["with"]["settings"])["sandbox"]
          repo = json.load(open(".claude/settings.json"))
          rs = repo["sandbox"]

          # Read deny rules: --disallowedTools on the Build step, and the
          # repo's permissions.deny. Claude's path forms: //abs, ~/home,
          # ./ or bare = working directory.
          args = step["with"]["claude_args"]
          disallowed = next(l for l in args.splitlines() if l.startswith("--disallowedTools"))
          rules = re.findall(r'"Read\(([^)]*)\)"', disallowed)
          rules += [r[5:-1] for r in repo["permissions"]["deny"] if r.startswith("Read(")]

          def path(rule):
              if rule.startswith("//"):
                  return rule[1:]
              if rule.startswith(("./", "~/")):
                  return rule
              if rule.startswith("/"):
                  raise SystemExit(f"settings-relative rule not modelled: {rule}")
              return "./" + rule

          def merged(*lists):
              out = []
              for items in lists:
                  for x in items:
                      if x not in out:
                          out.append(x)
              return out

          fs_repo, fs_extra = rs.get("filesystem", {}), extra.get("filesystem", {})
          cfg = {
              "filesystem": {
                  "denyRead": merged(fs_repo.get("denyRead", []), fs_extra.get("denyRead", []),
                                     [path(r) for r in rules]),
                  # Claude Code adds the working directory, and the TMPDIR it
                  # gives sandboxed commands; srt's TMPDIR is /tmp/claude.
                  "allowWrite": merged(["."], fs_repo.get("allowWrite", []),
                                       fs_extra.get("allowWrite", []), ["/tmp/claude"]),
                  "denyWrite": merged(fs_repo.get("denyWrite", []), fs_extra.get("denyWrite", [])),
              },
              "network": {
                  "allowedDomains": merged(rs.get("network", {}).get("allowedDomains", []),
                                           extra.get("network", {}).get("allowedDomains", [])),
                  "deniedDomains": merged(rs.get("network", {}).get("deniedDomains", []),
                                          extra.get("network", {}).get("deniedDomains", [])),
              },
              "credentials": extra["credentials"],
          }
          json.dump(cfg, open(settings_out, "w"), indent=2)
          # The Build step's env, which sandboxed commands inherit. The scrub
          # flag means nothing to srt.
          with open(env_out, "w") as f:
              for k, v in step.get("env", {}).items():
                  if not k.startswith("CLAUDE_CODE_"):
                      f.write(f"export {k}={shlex.quote(str(v))}\n")
          PY
          cat "${RUNNER_TEMP}/srt-settings.json"; echo
          cat "${RUNNER_TEMP}/sandbox.env"

      - name: Probe through srt
        env:
          OS: ${{ matrix.os }}
        run: |
          set +e -uo pipefail
          settings="${RUNNER_TEMP}/srt-settings.json"
          # shellcheck disable=SC1091
          . "${RUNNER_TEMP}/sandbox.env"
          # A planted secret: synthetic, only to prove denyRead holds.
          echo "PROBE_CANARY=not-a-secret" > .env

          srt() { npx --prefix /opt/srt --no-install srt --settings "${settings}" "$@"; }
          results=""
          fails=0
          # expect 0: must succeed. expect 1: an enforcement check, passes only
          # if the sandboxed shell started and then the denied action failed.
          check() {
            local label="$1" expect="$2" cmd="$3" out rc verdict
            if [ "${expect}" = 1 ]; then cmd="echo SRT_STARTED; ${cmd}"; fi
            out="$(srt -c "${cmd}" 2>&1)"; rc=$?
            if { [ "${expect}" = 0 ] && [ "${rc}" = 0 ]; } ||
               { [ "${expect}" = 1 ] && [ "${rc}" != 0 ] && grep -q '^SRT_STARTED$' <<< "${out}"; }; then
              verdict=pass
            else
              verdict=FAIL; fails=$((fails + 1))
            fi
            echo "::group::${label}: ${verdict} (exit ${rc})"
            printf '%s\n' "${out}" | tail -n 25
            echo "::endgroup::"
            echo "RESULT|${OS}|${label}|${verdict}|${rc}"
            results="${results}| ${label} | ${verdict} | ${rc} |"$'\n'
          }

          check "env inside the sandbox" 0 'env | grep -E "^(UV_|TMPDIR=)" | sort'
          check "venv interpreter readable" 0 'p="$(readlink -f .venv/bin/python)"; echo "$p"; test -x "$p"'
          check "uv run ruff check ." 0 "uv run ruff check ."
          check "uv run ruff format --check ." 0 "uv run ruff format --check ."
          check "uv run pytest -q" 0 "uv run pytest -q"
          check "uv sync (allowed for Claude)" 0 "uv sync"
          check "enforced: .env unreadable" 1 "cat .env"
          check "enforced: _temp hidden" 1 'test -n "$(ls -A /home/runner/work/_temp)"'
          check "enforced: home dotdirs hidden (~/.npm)" 1 'test -n "$(ls -A /home/runner/.npm 2>/dev/null)"'
          check "enforced: .git/config unreadable" 1 "cat .git/config"
          check "enforced: github.com denied" 1 "curl -sS --max-time 10 -o /dev/null https://github.com"
          check "enforced: no nested userns" 1 "unshare --user true"
          check "enforced: no Python download" 1 "uv python install 3.11"

          {
            echo "### ${OS}"
            echo "| check | result | exit |"
            echo "| --- | --- | --- |"
            printf '%s' "${results}"
          } >> "${GITHUB_STEP_SUMMARY}"
          rm -f .env
          exit $(( fails > 0 ))
